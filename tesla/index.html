<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tesla sign-in</title>
<style>
  body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;padding:40px 16px;background:#f2f2f7;color:#1c1c1e}
  main{max-width:560px;margin:0 auto;background:#fff;border-radius:12px;padding:24px}
  h1{font-size:20px;margin:0 0 12px}
  p{margin:0 0 12px}
  textarea{width:100%;box-sizing:border-box;height:120px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid #c7c7cc;border-radius:10px;padding:10px}
  button{font:inherit;padding:10px 16px;border:0;border-radius:10px;background:#1c1c1e;color:#fff;cursor:pointer}
  .muted{color:#6e6e73;font-size:14px}
</style>
</head>
<body>
<main>
  <h1 id="h">Tesla sign-in</h1>
  <p id="p">One moment…</p>
  <div id="manual" hidden>
    <textarea id="addr" readonly></textarea>
    <p><button id="copy" type="button">Copy the address</button></p>
    <p class="muted">Then go back to the portal: Executive &gt; EV Chargers &gt; Setup, and paste it into the box under &ldquo;Sign in with Tesla&rdquo;.</p>
  </div>
</main>
<script>
// Tesla sends the browser here after a sign-in, with a one-time code in the address. This page keeps nothing and sends nothing anywhere
// except back to the portal that started the sign-in, and only when that portal is on a private network (192.168.x.x, 10.x.x.x, 172.16-31.x.x
// or this computer). Otherwise it just shows the address so it can be copied by hand. The code is useless without the application's secret.
(function () {
  var q = new URLSearchParams(location.search), code = q.get('code'), state = q.get('state'), err = q.get('error');
  var h = document.getElementById('h'), p = document.getElementById('p');
  if (err) { h.textContent = 'Tesla did not sign you in'; p.textContent = (q.get('error_description') || err) + '. Go back to the portal and press "Sign in with Tesla" again.'; return; }
  if (!code) { h.textContent = 'Nothing to do here'; p.textContent = 'This page is where Tesla returns you after signing in from the portal.'; return; }
  var back = '';
  try { var s = (state || '').replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; back = String(JSON.parse(atob(s)).r || ''); } catch (e) { back = ''; }
  var priv = /^https?:\/\/(localhost|127\.0\.0\.1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})(:\d{1,5})?$/;
  function manual() {
    h.textContent = 'Signed in - one more step'; p.textContent = 'Copy this address and paste it into the portal:';
    document.getElementById('manual').hidden = false; var a = document.getElementById('addr'); a.value = location.href;
    document.getElementById('copy').onclick = function () { a.select(); try { navigator.clipboard.writeText(a.value); } catch (e) { document.execCommand('copy'); } this.textContent = 'Copied'; };
  }
  if (priv.test(back)) {
    h.textContent = 'Signed in'; p.textContent = 'Taking you back to the portal…';
    setTimeout(manual, 4000);       // if the portal cannot be reached from this device, the address is still there to copy
    location.replace(back + '/api/tesla/callback?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state || ''));
  } else manual();
})();
</script>
</body>
</html>
